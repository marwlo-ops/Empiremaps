services:
  - type: web
    name: empiremaps-web
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r webapp/requirements.txt
    startCommand: uvicorn webapp.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GGETRACKER_API_KEY
        sync: false
