name: Import upstream repository 1:1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mirror-files:
    if: github.event.head_commit.message != 'Mirror upstream source files 1:1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Copy all tracked and untracked upstream files
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/nathael-aa/gge-assistant-bot.git /tmp/upstream
          rsync -a --delete --exclude='.git' /tmp/upstream/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to mirror."
            exit 0
          fi
          git commit -m "Mirror upstream source files 1:1"
          git push origin HEAD:main
